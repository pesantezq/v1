# Northstar post-merge orchestrator.
#
# BOOTSTRAP MODE: SHADOW. Triggers when `northstar-ci` completes on `main`.
# Certifies the exact post-merge main SHA and runs the deterministic transition
# proposer — emitting POST_MERGE_CERTIFIED / NEXT_MISSION_READY / STOP. It
# performs NO merge, NO governance-state mutation, and NO Claude dispatch.
#
# SECURITY: a `workflow_run` workflow always executes the version of this file on
# the DEFAULT branch (trusted `main`), never a PR's copy. It checks out `main`
# (trusted controller code) and runs only that code — it never downloads or
# executes untrusted PR artifacts. Least-privilege token; no secrets.
name: northstar-orchestrator

on:
  workflow_run:
    workflows: ["northstar-ci"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northstar-orchestrator-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  post-merge-certify:
    name: Post-merge certification + transition proposal
    # Fail closed: only a SUCCESSFUL push-to-main northstar-ci run qualifies.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      WF_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      WF_EVENT: ${{ github.event.workflow_run.event }}
      WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
      WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Checkout TRUSTED controller code from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install -r requirements.txt

      - name: Certify exact post-merge main SHA
        shell: bash
        run: |
          set -uo pipefail
          CUR=$(git rev-parse origin/main 2>/dev/null || git rev-parse HEAD)
          echo "workflow_run head: ${WF_HEAD_SHA:-<dispatch>}   current main: $CUR"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] && [ "${WF_HEAD_SHA}" != "$CUR" ]; then
            echo "::warning::main advanced since this run (${WF_HEAD_SHA} != $CUR) — not certifying; fail closed."
            echo "POST_MERGE_CERTIFIED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "POST_MERGE_CERTIFIED=true" >> "$GITHUB_ENV"
          echo "CERTIFIED_SHA=$CUR" >> "$GITHUB_ENV"

      - name: Deterministic transition proposal (shadow)
        if: env.POST_MERGE_CERTIFIED == 'true'
        shell: bash
        run: |
          set -uo pipefail
          TRANS=scripts/northstar_transition.py
          REG=.agent/mission_registry.yaml
          if [ ! -f "$TRANS" ] || [ ! -f "$REG" ]; then
            echo "::notice::transition tooling not durable on main yet — shadow no-op."
            exit 0
          fi
          python - "$REG" "$CERTIFIED_SHA" "$WF_CONCLUSION" "$WF_EVENT" "$WF_BRANCH" > /tmp/trans_inputs.json <<'PY'
          import json, sys, pathlib
          reg_path, sha, concl, event, branch = sys.argv[1:6]
          event = event or "push"; concl = concl or "success"; branch = branch or "main"
          repo_root = pathlib.Path(".").resolve()
          try:
              import yaml
              reg = yaml.safe_load(pathlib.Path(reg_path).read_text(encoding="utf-8"))
              mode = (reg.get("controller") or {}).get("mode", "shadow")
          except Exception:
              reg, mode = {"missions": {}}, "shadow"
          # authoritative mission via fail-closed roadmap_guard
          try:
              from portfolio_automation.engineer_worker.roadmap_guard import RoadmapAuthorization
              auth = RoadmapAuthorization.read(repo_root)
              mission = auth.authorized_mission_id if auth.authoritative else None
          except Exception:
              mission = None
          # preserved paused authorization (verbatim)
          paused = None
          try:
              ph = yaml.safe_load(pathlib.Path(".agent/phase_status.yaml").read_text(encoding="utf-8"))
              ba = ph["stockbot_northstar_redesign"]["phases"]["northstar_phase_0c"]["bounded_authorization"]
              paused = ba.get("paused_bounded_authorization")
          except Exception:
              paused = None
          print(json.dumps({
              "mode": mode,
              "completed_mission": mission,
              "authoritative_mission": mission,
              "registry": reg,
              "paused_authorization": paused,
              "certified_main_sha": sha,
              "protected_main_sha": sha,
              "post_merge": {"conclusion": concl, "event": event, "head_branch": branch, "head_sha": sha},
          }))
          PY
          echo "----- transition decision -----"
          python "$TRANS" evaluate --inputs /tmp/trans_inputs.json | tee /tmp/trans_out.json
          {
            echo "### Post-merge certification + transition (shadow)"
            echo "POST_MERGE_CERTIFIED=true  CERTIFIED_SHA=$CERTIFIED_SHA"
            echo ''
            echo '```json'
            cat /tmp/trans_out.json
            echo '```'
            echo ''
            echo '_Shadow mode: no merge, no state mutation, no dispatch._'
          } >> "$GITHUB_STEP_SUMMARY" || true
