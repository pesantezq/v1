# StockBot Northstar CI — Phase 0A governance foundation
# (NORTHSTAR_0A_CI_FOUNDATION, 2026-08-09)
#
# Validation only. This workflow provides reproducible evidence, independent
# of any agent's local/VPS claims, that the repository's engineering and
# governance invariants hold: syntax/import health, the machine-readable
# authority model (config/agent_policy.yaml), Northstar project-state
# correctness, documentation/governance consistency, the operator-control
# boundary, and the broad hermetic regression suite.
#
# It deliberately does NOT: reproduce the production pipeline, contact the
# VPS, use any credential or secret, read live outputs/, or mutate anything.
# Live production validation (real artifacts, cron, services, broker/FMP
# reachability) stays on the VPS and is out of CI scope by design — see
# docs/NORTHSTAR_REDESIGN.md §"CI foundation".

name: northstar-ci

on:
  push:
    branches:
      - main
      - "feature/northstar-**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Test-only CI: read the repo, write nothing.
permissions:
  contents: read

# Supersede in-flight runs for the same ref; keep main runs complete.
concurrency:
  group: northstar-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  northstar-governance:
    name: Northstar governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # requirements.txt is the repository's single authoritative RUNTIME
        # dependency source; requirements-dev.txt holds test-only tools
        # (pytest, pytest-xdist) and is never installed on the VPS. No
        # uv/poetry — plain pip per repo convention. The pip cache above is a
        # DEPENDENCY cache only: no test verdict is ever cached.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile
        run: |
          python -m py_compile \
            portfolio_automation/agent_policy.py \
            scripts/agent_context_check.py

      - name: Validate project state (agent context check)
        run: python scripts/agent_context_check.py

      - name: Validate Northstar authority policy
        run: python -m pytest -q tests/test_agent_policy.py

      - name: Validate Northstar roadmap state
        run: |
          python -m pytest -q \
            tests/test_northstar_authority.py \
            tests/test_agent_context_check.py

      - name: Validate documentation governance
        run: python -m pytest -q tests/test_doc_audit.py

      - name: Validate operator-control boundary
        run: python -m pytest -q tests/test_operator_control.py

      - name: Verify certification sharding (collection equivalence)
        # Proves, by exact node ID, that the union of the shards below is the
        # official full-suite universe (scripts/ci_test_shards.py): nothing
        # dropped, nothing duplicated. Drift fails here, visibly.
        run: |
          python -m pytest -q tests/test_ci_test_shards.py
          python scripts/ci_test_shards.py verify

  tests:
    name: Hermetic regression tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Logical domain shards, by test ownership (scripts/ci_test_shards.py).
        # Every file the official full-suite command collects belongs to exactly
        # one shard, `core` is the catch-all, and the governance job proves the
        # union equals the official collection by exact node ID.
        shard: [governance, evidence_data, broker_portfolio, strategy_research, gui_readmodels, core]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Configure git identity for test fixtures
        # tests/test_worker_workspace.py exercises clone/worktree isolation by
        # making real git commits; hosted runners have no global git identity
        # (the VPS does), so provide the standard CI one. This is runner
        # infrastructure, not a test weakening.
        run: |
          git config --global user.email "ci@northstar.invalid"
          git config --global user.name "northstar-ci"

      - name: Run shard (parallel phase)
        # The certification universe is the repository's declared full-suite
        # command (.agent/project_state.yaml:required_test_policy.full_suite_command)
        # with its two declared --ignore exclusions, plus 10 deselected node IDs
        # that VALIDATE LIVE PRODUCTION RUNTIME STATE or production-host
        # assumptions and therefore cannot run hermetically (classified
        # 2026-08-09; each passes against the live VPS corpus and stays in the
        # VPS-side full suite): test_artifact_registry (live outputs/ corpus),
        # test_gui_dashboard_memo/quant (3, live daily-memo + quant artifacts),
        # test_strategy_projection_anchor (live sandbox strategy),
        # test_broker_overlay (4, hardcoded /opt/stockbot/config.json),
        # test_operator_worker_runner::test_safe_repair_... (needs a `claude`
        # binary). Both lists live ONCE in scripts/ci_test_shards.py
        # (`pytest-args`) so local and CI runs cannot disagree.
        #
        # pytest-xdist runs this shard's files across 4 workers (ubuntu-latest
        # has 4 vCPUs; the QPC benchmark chose 8 for 8 CPUs). Tests marked
        # `serial` (pytest.ini) are excluded here and run in the serial job.
        # -p no:cacheprovider: no .pytest_cache, no --lf/--ff, no inference from
        # any earlier SHA -- this is the exact-head gate. tests/conftest.py
        # guards the protected scoring registry in every worker. Any failure
        # here is a real regression -- do not mask it with skips or `|| true`.
        run: |
          FILES=$(python scripts/ci_test_shards.py files "${{ matrix.shard }}")
          python -m pytest -q -p no:cacheprovider -n 4 --dist=load -m "not serial" \
            $(python scripts/ci_test_shards.py pytest-args) $FILES

  tests-serial:
    name: Hermetic regression tests (serial phase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Configure git identity for test fixtures
        run: |
          git config --global user.email "ci@northstar.invalid"
          git config --global user.name "northstar-ci"

      - name: Run serial-marked tests in one process
        # Tests that validate process- or repository-wide state carry the
        # `serial` marker and run here, alone, without xdist: nine tests in six
        # files that write shared checkout files (data/fmp_budget.db,
        # outputs/latest/*, outputs/operator_control/audit_log.jsonl, ...),
        # attributed per node on 2026-09-27 and justified at each marker. They
        # are part of the exact-head gate, never dropped.
        run: |
          N=$(python scripts/ci_test_shards.py serial-count)
          echo "serial tests collected: $N"
          if [ "$N" = "0" ]; then
            echo "no serial-marked tests; nothing to run"
          else
            python -m pytest -q -p no:cacheprovider -m serial \
              $(python scripts/ci_test_shards.py pytest-args)
          fi
