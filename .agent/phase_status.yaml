      + explicit --approve flag; delegates approval enforcement to existing
      assert_can_update_portfolio_state().  Atomically rewrites only
      portfolio.holdings and portfolio.cash_available in config.json (all
      other config keys preserved byte-for-byte).  Writes a pre-update
      backup to outputs/policy/portfolio_backups/ and appends one JSONL line
      per run to outputs/policy/manual_portfolio_updates.jsonl.  No broker/API
      calls, no LLM/AI, no scoring/allocation/recommendation/watchlist/
      discovery mutation.  CSV input is the primary format; JSON also
      supported.  Strict header validation, symbol regex, non-negative
      shares, duplicate detection, ISO date and non-negative cash gates.
    files:
