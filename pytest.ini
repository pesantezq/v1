[pytest]
# Marker registration only. No addopts: `python -m pytest -q` (the official
# full-suite command in .agent/project_state.yaml and AGENTS.md) behaves exactly
# as before; pytest-xdist is inert unless `-n` is passed explicitly.
markers =
    serial: must run in one process, outside pytest-xdist workers, because it validates process- or repository-wide state. Excluded from the parallel phase of every CI shard and run afterwards by the `serial` phase (scripts/ci_test_shards.py serial-count). Applied only with evidence: 2026-09-27 attribution found nine tests in six files that write shared checkout files (data/fmp_budget.db, outputs/latest/*, outputs/operator_control/audit_log.jsonl, outputs/policy/ai_usage_events.jsonl, outputs/latest/artifact_registry_status.json); each carries a comment naming the file. Add it only with the same kind of evidence.
