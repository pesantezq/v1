# /etc/ssh/sshd_config.d/60-stockbot-observer.conf   (drop-in; OpenSSH >= 8.2)
# Restricts ONLY the dedicated stockbot-observer account. It does NOT change any
# global sshd setting and does NOT affect the operator/admin (stockbot-agent)
# login — so applying it cannot lock the operator out.
#
# Apply order (see docs/PROD_EVIDENCE_DIRECT_V0.md): install this file, run
# `sshd -t` to validate, and ONLY reload sshd while a separate operator/root
# session stays open as a safety net.

Match User stockbot-observer
    ForceCommand /usr/local/sbin/stockbot-observe
    PasswordAuthentication no
    PubkeyAuthentication yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    GatewayPorts no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no

# Belt-and-suspenders: the observer's authorized_keys entry ALSO pins the
# command and drops every capability. Put this single line in
# /home/stockbot-observer/.ssh/authorized_keys (root-owned dir 0700, file 0600
# owned by stockbot-observer, content installed by the operator):
#
# restrict,command="/usr/local/sbin/stockbot-observe" ssh-ed25519 AAAA...<observer pubkey>... stockbot-observer@trusted-controller
#
# `restrict` implies: no-agent-forwarding, no-port-forwarding, no-pty,
# no-user-rc, no-X11-forwarding (and any future restrictions). The command=
# forces the wrapper even if the Match block were ever removed.
